services:
  - type: web
    name: jax-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secrets + sheet ID live in this Render environment group:
      #   GOOGLE_SA_JSON_B64, ORG_SHEET_ID, ORG_GMAIL_ADDRESS, ORG_GMAIL_APP_PASSWORD
      - fromGroup: Jax Creed Variables
      - key: REPLY_TO
        value: Jax@usecreed.com
      - key: IMAP_HOST
        value: imap.gmail.com
      # Days after last touch before a contact is flagged "needs follow-up".
      - key: FOLLOWUP_DAYS
        value: 5
