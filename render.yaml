services:
  - type: web
    name: jax-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      # Google Sheet (source of truth). Service account JSON, base64-encoded.
      - key: GOOGLE_SA_JSON_B64
        sync: false
      - key: ORG_SHEET_ID
        sync: false
      # Gmail send + IMAP reply scan (Google Workspace app password).
      - key: ORG_GMAIL_ADDRESS
        sync: false
      - key: ORG_GMAIL_APP_PASSWORD
        sync: false
      - key: REPLY_TO
        value: Jax@usecreed.com
      - key: IMAP_HOST
        value: imap.gmail.com
      # Days after last touch before a contact is flagged "needs follow-up".
      - key: FOLLOWUP_DAYS
        value: 5
