<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creed Outreach CRM</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --txt: #e7eaf0; --muted: #9aa3b2; --accent: #6c8cff; --accent2: #4d6bff;
    --green: #34c759; --amber: #ffb020; --red: #ff5c5c; --blue: #4aa3ff; --gray:#6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg); color: var(--txt); font-size: 14px; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  .pipeline-tabs { display: flex; gap: 4px; }
  .pipeline-tabs button { background: transparent; color: var(--muted); border: 1px solid transparent;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .pipeline-tabs button.active { background: var(--panel2); color: var(--txt); border-color: var(--line); }
  .btn { background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn.primary:hover { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }

  .stats { display: flex; gap: 10px; padding: 14px 22px 0; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; min-width: 92px; }
  .stat .n { font-size: 20px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; }
  .stat.clickable { cursor: pointer; } .stat.clickable:hover { border-color: var(--accent); }
  .stat.sel { border-color: var(--accent); }

  .filters { display: flex; gap: 10px; padding: 14px 22px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { background: var(--panel); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .filters input[type=search] { min-width: 240px; }
  .muted { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .4px; padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--bg); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:hover { background: var(--panel); cursor: pointer; }
  .tablewrap { padding: 0 22px 22px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .pill.not_contacted { background: #2a2f3a; color: var(--muted); }
  .pill.emailed { background: rgba(74,163,255,.15); color: var(--blue); }
  .pill.needs_followup { background: rgba(255,176,32,.15); color: var(--amber); }
  .pill.replied { background: rgba(52,199,89,.16); color: var(--green); }
  .pill.bounced { background: rgba(255,92,92,.16); color: var(--red); }
  .chk { width: 15px; height: 15px; accent-color: var(--accent2); }

  .pager { display: flex; align-items: center; gap: 12px; padding: 14px 22px; }

  /* Drawer */
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: none; }
  .drawer-bg.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 460px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--line); z-index: 31; transform: translateX(100%);
    transition: transform .18s ease; overflow-y: auto; padding: 22px; }
  .drawer.open { transform: translateX(0); }
  .drawer h2 { margin: 0 0 4px; font-size: 18px; }
  .drawer .field { margin: 14px 0; }
  .drawer .field label { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .4px; margin-bottom: 4px; }
  .drawer .field .v { font-size: 14px; }
  .drawer textarea, .drawer input { width: 100%; background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .drawer textarea { min-height: 130px; resize: vertical; }
  .reply { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .reply .meta { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
  .reply .snip { font-size: 12.5px; white-space: pre-wrap; color: #cfd6e2; max-height: 120px; overflow: auto; }
  .row-actions { display: flex; gap: 8px; margin-top: 18px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--line); padding: 11px 18px; border-radius: 10px; z-index: 50; display: none; }
  .toast.show { display: block; }
  .placeholder-note { background: rgba(255,176,32,.1); border: 1px solid rgba(255,176,32,.3);
    color: var(--amber); padding: 8px 11px; border-radius: 8px; font-size: 12px; margin-top: 10px; }
  .bulkbar { display:none; gap:10px; align-items:center; padding: 10px 22px; background: var(--panel);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .bulkbar.show { display: flex; }
</style>
</head>
<body>
<header>
  <h1>Creed Outreach CRM</h1>
  <div class="pipeline-tabs" id="pipelineTabs">
    <button data-p="churches" class="active">Churches</button>
    <button data-p="brands">Brands</button>
    <button data-p="top">Top Churches</button>
  </div>
  <div class="spacer"></div>
  <span class="muted" id="syncInfo"></span>
  <button class="btn primary" id="addBtn">+ Add contact</button>
  <button class="btn" id="scanBtn">Scan replies</button>
  <button class="btn" id="syncBtn">Sync sheet</button>
</header>

<div class="stats" id="stats"></div>

<div class="filters">
  <input type="search" id="q" placeholder="Search org, person, email, area...">
  <select id="areaFilter"><option value="">All areas</option></select>
  <select id="statusFilter">
    <option value="">All statuses</option>
    <option value="not_contacted">Not contacted</option>
    <option value="emailed">Emailed</option>
    <option value="needs_followup">Needs follow-up</option>
    <option value="replied">Replied</option>
    <option value="bounced">Bounced</option>
  </select>
  <button class="btn" id="clearFilters">Clear</button>
  <span class="spacer" style="flex:1"></span>
  <span class="muted" id="resultCount"></span>
</div>

<div class="bulkbar" id="bulkbar">
  <span id="bulkCount" class="muted"></span>
  <select id="bulkTemplate"></select>
  <button class="btn primary" id="bulkSend">Send follow-up to selected</button>
  <button class="btn" id="bulkClear">Clear selection</button>
</div>

<div class="tablewrap">
  <table>
    <thead><tr id="theadRow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="pager">
  <button class="btn sm" id="prevPage">Prev</button>
  <span class="muted" id="pageInfo"></span>
  <button class="btn sm" id="nextPage">Next</button>
</div>

<!-- Drawer -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
const state = {
  pipeline: 'churches',
  page: 1, pageSize: 100,
  q: '', area: '', status: '',
  rows: [], total: 0,
  selected: new Set(),
  templates: {}, config: {},
  replies: {}, // email -> [{subject, snippet, date}]
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

const STATUS_LABEL = { not_contacted:'Not contacted', emailed:'Emailed', needs_followup:'Needs follow-up', replied:'Replied', bounced:'Bounced' };
const PIPE_LABEL = { churches:'Churches', brands:'Brands', top:'Top Churches' };

function renderStats(s) {
  const order = ['total','not_contacted','emailed','needs_followup','replied','bounced'];
  let html = order.map(k => {
    const sel = (k !== 'total' && state.status === k) ? ' sel' : '';
    const click = k === 'total' ? '' : ` data-status="${k}"`;
    const label = k === 'total' ? 'Total' : STATUS_LABEL[k];
    return `<div class="stat clickable${sel}"${click}><div class="n">${s[k] ?? 0}</div><div class="l">${label}</div></div>`;
  }).join('');
  if (state.pipeline === 'top' && s.totalUsers != null) {
    html += `<div class="stat"><div class="n">${s.totalUsers}</div><div class="l">Total users</div></div>`;
  }
  $('#stats').innerHTML = html;
  $('#stats').querySelectorAll('[data-status]').forEach(el => el.onclick = () => {
    const st = el.getAttribute('data-status');
    state.status = state.status === st ? '' : st;
    $('#statusFilter').value = state.status; state.page = 1; load();
  });
}

function headers() {
  const cols = ['<th style="width:28px"><input type="checkbox" class="chk" id="selAll"></th>',
    '<th>Org</th>','<th>Person</th>','<th>Area</th>','<th>Reach out</th>'];
  if (state.pipeline === 'top') cols.push('<th>Users</th>');
  cols.push('<th>Follow-ups</th>','<th>Status</th>');
  return cols.join('');
}

function rowHtml(r) {
  const cells = [
    `<td onclick="event.stopPropagation()"><input type="checkbox" class="chk rowchk" data-id="${r.rowId}" ${state.selected.has(r.rowId)?'checked':''}></td>`,
    `<td>${esc(r.org)}</td>`,
    `<td>${esc(r.person)}<div class="muted" style="font-size:12px">${esc(r.email)}</div></td>`,
    `<td>${esc(r.area) || '<span class="muted">-</span>'}</td>`,
    `<td>${esc(r.reachOut) || '<span class="muted">-</span>'}</td>`,
  ];
  if (state.pipeline === 'top') cells.push(`<td>${esc(r.userCount) || '0'}</td>`);
  cells.push(`<td>${r.followCount || 0}</td>`);
  cells.push(`<td><span class="pill ${r.status}">${STATUS_LABEL[r.status]}</span></td>`);
  return `<tr data-id="${r.rowId}">${cells.join('')}</tr>`;
}

async function load() {
  const qs = new URLSearchParams({ pipeline: state.pipeline, page: state.page, pageSize: state.pageSize,
    q: state.q, area: state.area, status: state.status });
  if (state.pipeline === 'top') qs.set('sort', 'userCount');
  const data = await api('/api/orgs?' + qs.toString());
  state.rows = data.rows; state.total = data.total;
  $('#theadRow').innerHTML = headers();
  $('#tbody').innerHTML = data.rows.map(rowHtml).join('') || `<tr><td colspan="8" class="muted" style="padding:24px;text-align:center">No matches.</td></tr>`;
  $('#resultCount').textContent = `${data.total} result${data.total===1?'':'s'}`;
  const pages = Math.max(1, Math.ceil(data.total / data.pageSize));
  $('#pageInfo').textContent = `Page ${data.page} / ${pages}`;
  $('#prevPage').disabled = data.page <= 1;
  $('#nextPage').disabled = data.page >= pages;
  $('#syncInfo').textContent = data.fetchedAt ? ('synced ' + new Date(data.fetchedAt).toLocaleTimeString()) : '';
  bindRows();
  api('/api/stats?pipeline=' + state.pipeline).then(renderStats).catch(()=>{});
}

function bindRows() {
  $('#tbody').querySelectorAll('tr[data-id]').forEach(tr => {
    tr.onclick = () => openDrawer(Number(tr.getAttribute('data-id')));
  });
  $('#tbody').querySelectorAll('.rowchk').forEach(cb => {
    cb.onchange = () => { const id = Number(cb.getAttribute('data-id'));
      cb.checked ? state.selected.add(id) : state.selected.delete(id); updateBulk(); };
  });
  const selAll = $('#selAll');
  if (selAll) selAll.onchange = () => {
    state.rows.forEach(r => selAll.checked ? state.selected.add(r.rowId) : state.selected.delete(r.rowId));
    $('#tbody').querySelectorAll('.rowchk').forEach(cb => cb.checked = selAll.checked); updateBulk();
  };
}

function updateBulk() {
  const n = state.selected.size;
  $('#bulkbar').classList.toggle('show', n > 0);
  $('#bulkCount').textContent = `${n} selected`;
}

async function loadAreas() {
  const { areas } = await api('/api/areas?pipeline=' + state.pipeline);
  const sel = $('#areaFilter');
  sel.innerHTML = '<option value="">All areas</option>' +
    areas.map(a => `<option value="${esc(a.area)}">${esc(a.area)} (${a.count})</option>`).join('');
  sel.value = state.area;
}

function openDrawer(rowId) {
  const r = state.rows.find(x => x.rowId === rowId);
  if (!r) return;
  const replies = state.replies[(r.email||'').toLowerCase()] || [];
  const tpls = state.templates[state.pipeline] || [];
  const drawer = $('#drawer');
  drawer.innerHTML = `
    <button class="btn sm" style="float:right" onclick="closeDrawer()">Close</button>
    <h2>${esc(r.org)}</h2>
    <div class="muted">${esc(r.person)}${r.position?(' &middot; '+esc(r.position)):''}</div>
    <div class="field"><label>Status</label><div class="v"><span class="pill ${r.status}">${STATUS_LABEL[r.status]}</span></div></div>
    <div class="field"><label>Email</label><div class="v">${esc(r.email)||'<span class="muted">none</span>'}</div></div>
    <div class="field"><label>Area</label><div class="v">${esc(r.area)||'<span class="muted">-</span>'}</div></div>
    <div class="field"><label>Reach out date</label><div class="v">${esc(r.reachOut)||'-'}</div></div>
    <div class="field"><label>Follow-ups sent</label><div class="v">${r.followCount||0}${r.lastFollowUp?(' (last '+esc(r.lastFollowUp)+')'):''}${r.nextFollowUp?(' &middot; next due '+esc(r.nextFollowUp)):''}</div></div>
    ${state.pipeline==='top' ? `<div class="field"><label>User count</label><div class="v">${esc(r.userCount)||'-'}</div></div>` : ''}
    <div class="field"><label>Replies received (${replies.length})</label>
      ${replies.length ? replies.map(rp=>`<div class="reply"><div class="meta">${esc(rp.subject)} &middot; ${rp.date?new Date(rp.date).toLocaleDateString():''}</div><div class="snip">${esc(rp.snippet||'')}</div></div>`).join('')
        : '<div class="muted">No replies matched yet. Run "Scan replies".</div>'}
    </div>
    <div class="field"><label>Notes</label><div class="v" style="white-space:pre-wrap">${esc(r.notes)||'<span class="muted">-</span>'}</div></div>
    <div class="row-actions">
      <button class="btn" onclick="editContact(${rowId})">Edit contact</button>
      <button class="btn" onclick="markFollowedUp(${rowId})">Mark followed up</button>
      <button class="btn primary" onclick="openFollowUp(${rowId})">Send follow-up</button>
    </div>
    <div id="fuPanel"></div>
  `;
  $('#drawerBg').classList.add('open'); drawer.classList.add('open');
}
function closeDrawer() { $('#drawer').classList.remove('open'); $('#drawerBg').classList.remove('open'); }

// Shared Add/Edit form. rowId null => add new contact.
function renderContactForm(rowId) {
  const r = (rowId != null) ? state.rows.find(x => x.rowId === rowId) : {};
  const isTop = state.pipeline === 'top';
  const drawer = $('#drawer');
  const field = (id, label, val, type) =>
    `<div class="field"><label>${label}</label><input id="${id}" ${type==='date'?'type="date"':''} value="${esc(val||'')}"></div>`;
  drawer.innerHTML = `
    <button class="btn sm" style="float:right" onclick="closeDrawer()">Close</button>
    <h2>${rowId != null ? 'Edit contact' : 'Add contact'}</h2>
    <div class="muted">${esc(PIPE_LABEL[state.pipeline] || state.pipeline)} pipeline</div>
    ${field('eOrg', 'Org name *', r.org)}
    ${field('ePerson', 'Person name', r.person)}
    ${field('ePosition', 'Person position', r.position)}
    ${field('eEmail', 'Email', r.email)}
    ${field('eArea', isTop ? 'City / Area' : 'Area', r.area)}
    ${isTop ? field('eUserCount', 'User count', r.userCount) : ''}
    ${field('eReachOut', 'Reach out date', r.reachOut, 'date')}
    <div class="field"><label>Notes</label><textarea id="eNotes">${esc(r.notes||'')}</textarea></div>
    <div class="row-actions">
      ${rowId != null
        ? `<button class="btn primary" onclick="saveContact(${rowId})">Save changes</button>
           <button class="btn" onclick="openDrawer(${rowId})">Cancel</button>`
        : `<button class="btn primary" onclick="saveContact(null)">Add contact</button>
           <button class="btn" onclick="closeDrawer()">Cancel</button>`}
    </div>`;
  $('#drawerBg').classList.add('open'); drawer.classList.add('open');
}
function editContact(rowId) { renderContactForm(rowId); }
function openAddContact() { renderContactForm(null); }

async function saveContact(rowId) {
  const body = {
    pipeline: state.pipeline,
    org: $('#eOrg').value.trim(),
    person: $('#ePerson').value.trim(),
    position: $('#ePosition').value.trim(),
    email: $('#eEmail').value.trim(),
    area: $('#eArea').value.trim(),
    notes: $('#eNotes').value,
  };
  if ($('#eUserCount')) body.userCount = $('#eUserCount').value.trim();
  if ($('#eReachOut')) body.reachOut = $('#eReachOut').value;
  if (!body.org) return toast('Org name is required.');
  try {
    if (rowId != null) {
      await api('/api/orgs/' + rowId + '?pipeline=' + state.pipeline, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      toast('Saved to sheet');
    } else {
      await api('/api/orgs', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      toast('Contact added');
    }
    closeDrawer(); load();
  } catch(e){ toast('Error: '+e.message); }
}

function openFollowUp(rowId) {
  const r = state.rows.find(x => x.rowId === rowId);
  const tpls = state.templates[state.pipeline] || [];
  const tpl = tpls[0] || { subject:'', body:'' };
  const fill = s => String(s).replace(/\{org\}/g, r.org||'there').replace(/\{person\}/g, r.person||'there');
  $('#fuPanel').innerHTML = `
    <div class="placeholder-note">Placeholder follow-up copy. Edit before sending real outreach.</div>
    <div class="field"><label>Subject</label><input id="fuSubject" value="${esc(fill(tpl.subject))}"></div>
    <div class="field"><label>Message</label><textarea id="fuBody">${esc(fill(tpl.body))}</textarea></div>
    <div class="row-actions">
      <button class="btn primary" onclick="sendFollowUp(${rowId})">Send to ${esc(r.email)}</button>
    </div>`;
}

async function sendFollowUp(rowId) {
  if (!state.config.gmailConfigured) return toast('Gmail not configured on the server.');
  const body = { pipeline: state.pipeline, rowId, subject: $('#fuSubject').value, body: $('#fuBody').value };
  try { const r = await api('/api/follow-up', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    toast('Sent to ' + r.to); closeDrawer(); load(); } catch(e){ toast('Error: '+e.message); }
}

async function markFollowedUp(rowId) {
  if (!confirm('Mark as followed up? This records today’s date but sends NO email and does NOT change the follow-up count.')) return;
  try {
    const r = await api('/api/mark-followed-up', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pipeline: state.pipeline, rowId }) });
    toast('Marked followed up: ' + r.org); closeDrawer(); load();
  } catch(e){ toast('Error: '+e.message); }
}

// Bulk follow-up
$('#bulkSend').onclick = async () => {
  if (!state.config.gmailConfigured) return toast('Gmail not configured on the server.');
  const ids = [...state.selected];
  if (!ids.length) return;
  if (!confirm(`Send placeholder follow-up to ${ids.length} selected? (capped server-side)`)) return;
  const tid = $('#bulkTemplate').value;
  try {
    const r = await api('/api/follow-up/bulk', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pipeline: state.pipeline, rowIds: ids, templateId: tid }) });
    toast(`Sent ${r.sent.length}, failed ${r.failed.length}` + (ids.length>r.cap?` (capped at ${r.cap})`:''));
    state.selected.clear(); updateBulk(); load();
  } catch(e){ toast('Error: '+e.message); }
};
$('#bulkClear').onclick = () => { state.selected.clear(); updateBulk();
  $('#tbody').querySelectorAll('.rowchk').forEach(cb=>cb.checked=false); const s=$('#selAll'); if(s)s.checked=false; };

// Add contact
$('#addBtn').onclick = openAddContact;

// Sync + scan
$('#syncBtn').onclick = async () => {
  $('#syncBtn').disabled = true; $('#syncBtn').textContent = 'Syncing...';
  try { await api('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pipeline: state.pipeline }) });
    await loadAreas(); state.page=1; await load(); toast('Synced from sheet'); }
  catch(e){ toast('Error: '+e.message); }
  finally { $('#syncBtn').disabled=false; $('#syncBtn').textContent='Sync sheet'; }
};
$('#scanBtn').onclick = async () => {
  $('#scanBtn').disabled = true; $('#scanBtn').textContent = 'Scanning...';
  try { const r = await api('/api/replies/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pipelines:[state.pipeline] }) });
    state.replies = {};
    (r.matched||[]).forEach(m => { const k=(m.from||'').toLowerCase(); (state.replies[k]=state.replies[k]||[]).push(m); });
    toast(`Scanned ${r.scanned}, ${r.matched.length} reply match(es)`); load(); }
  catch(e){ toast('Error: '+e.message); }
  finally { $('#scanBtn').disabled=false; $('#scanBtn').textContent='Scan replies'; }
};

// Filters
let qTimer;
$('#q').oninput = e => { state.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(()=>{ state.page=1; load(); }, 250); };
$('#areaFilter').onchange = e => { state.area = e.target.value; state.page=1; load(); };
$('#statusFilter').onchange = e => { state.status = e.target.value; state.page=1; load(); };
$('#clearFilters').onclick = () => { state.q=state.area=state.status=''; $('#q').value=''; $('#areaFilter').value=''; $('#statusFilter').value=''; state.page=1; load(); };
$('#prevPage').onclick = () => { if(state.page>1){state.page--; load();} };
$('#nextPage').onclick = () => { state.page++; load(); };
$('#drawerBg').onclick = closeDrawer;

// Pipeline switch
$('#pipelineTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('#pipelineTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.pipeline = b.getAttribute('data-p');
  state.page=1; state.selected.clear(); updateBulk(); state.q=state.area=state.status='';
  $('#q').value=''; $('#statusFilter').value='';
  setBulkTemplates(); loadAreas(); load();
});

function setBulkTemplates() {
  const tpls = state.templates[state.pipeline] || [];
  $('#bulkTemplate').innerHTML = tpls.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('');
}

async function init() {
  try { state.config = await api('/api/config'); } catch(e){}
  try { state.templates = await api('/api/templates'); } catch(e){}
  setBulkTemplates();
  await loadAreas();
  await load();
}
init();
</script>
</body>
</html>
